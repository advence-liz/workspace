<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广告拦截器 - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🛡️ 广告拦截器 - 高级设置</h1>
    </header>

    <main>
      <section class="section">
        <h2>📊 统计信息</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">今日拦截</div>
            <div class="stat-number" id="todayCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">总计拦截</div>
            <div class="stat-number" id="totalCount">0</div>
          </div>
        </div>
        <button id="resetStats" class="btn btn-danger">重置统计</button>
      </section>

      <section class="section">
        <h2>🎯 自定义拦截规则</h2>
        <p class="description">添加自定义 CSS 选择器来拦截特定元素</p>

        <div class="input-group">
          <input type="text" id="customSelector" placeholder="例如: .custom-ad, #banner" />
          <button id="addSelector" class="btn btn-primary">添加</button>
        </div>

        <div id="selectorList" class="selector-list"></div>
      </section>

      <section class="section">
        <h2>⚙️ 拦截选项</h2>

        <div class="option-item">
          <label>
            <input type="checkbox" id="blockScripts" checked />
            <span>拦截广告脚本</span>
          </label>
        </div>

        <div class="option-item">
          <label>
            <input type="checkbox" id="blockImages" checked />
            <span>拦截广告图片</span>
          </label>
        </div>

        <div class="option-item">
          <label>
            <input type="checkbox" id="blockIframes" checked />
            <span>拦截广告 iframe</span>
          </label>
        </div>

        <div class="option-item">
          <label>
            <input type="checkbox" id="hideEmptySpace" checked />
            <span>隐藏广告位空白区域</span>
          </label>
        </div>
      </section>

      <section class="section">
        <h2>🚫 网络请求拦截规则</h2>
        <p class="description">管理广告域名拦截规则（静态规则不可删除）</p>

        <div class="input-group">
          <input type="text" id="rulePattern" placeholder="例如: *example.com* 或 *.ads.*" />
          <button id="addRule" class="btn btn-primary">添加规则</button>
        </div>

        <div id="rulesList" class="selector-list"></div>
      </section>

      <section class="section">
        <h2>📋 白名单</h2>
        <p class="description">在这些网站上不拦截广告</p>

        <div class="input-group">
          <input type="text" id="whitelistDomain" placeholder="例如: example.com" />
          <button id="addWhitelist" class="btn btn-primary">添加</button>
        </div>

        <div id="whitelistList" class="selector-list"></div>
      </section>
    </main>

    <footer>
      <button id="saveSettings" class="btn btn-success">💾 保存设置</button>
      <div id="saveMessage" class="save-message"></div>
    </footer>
  </div>

  <script src="options.js"></script>
</body>
</html>
