<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- 柔和的银灰色毛发 -->
    <linearGradient id="furGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c5c5c5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a9a9a;stop-opacity:1" />
    </linearGradient>
    <!-- 超白的毛发 -->
    <linearGradient id="furWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff5f5;stop-opacity:1" />
    </linearGradient>
    <!-- 粉嫩的耳朵内侧 -->
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcdd8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaeb9;stop-opacity:1" />
    </linearGradient>
    <!-- 大大的绿眼睛 - 更明亮 -->
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#b8f5b8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#7dd87d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a9a4a;stop-opacity:1" />
    </radialGradient>
    <!-- 腮红渐变 -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb6c1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff9eb0;stop-opacity:0.4" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆 - 柔和的粉色系 -->
  <circle cx="64" cy="64" r="60" fill="#fff5f7"/>

  <!-- 身体（圆润的白色胸部） -->
  <ellipse cx="64" cy="98" rx="32" ry="24" fill="url(#furWhite)"/>

  <!-- 尾巴（卷曲的灰色） -->
  <path d="M88 92 Q108 88, 112 72 Q116 58, 106 52"
        fill="none" stroke="url(#furGray)" stroke-width="12" stroke-linecap="round"/>

  <!-- 左耳（更圆润） -->
  <ellipse cx="36" cy="38" rx="14" ry="18" fill="url(#furGray)" transform="rotate(-20 36 38)"/>
  <ellipse cx="38" cy="40" rx="8" ry="12" fill="url(#earPink)" transform="rotate(-20 38 40)"/>

  <!-- 右耳（更圆润） -->
  <ellipse cx="92" cy="38" rx="14" ry="18" fill="url(#furGray)" transform="rotate(20 92 38)"/>
  <ellipse cx="90" cy="40" rx="8" ry="12" fill="url(#earPink)" transform="rotate(20 90 40)"/>

  <!-- 头部（更圆润的包子脸） -->
  <ellipse cx="64" cy="60" rx="42" ry="36" fill="url(#furGray)" filter="url(#softShadow)"/>

  <!-- 额头白色区域（M字开脸） -->
  <path d="M40 42 Q50 32, 64 38 Q78 32, 88 42 Q90 50, 85 58 Q78 52, 64 55 Q50 52, 43 58 Q38 50, 40 42"
        fill="url(#furWhite)"/>

  <!-- 脸部白色区域（加白）- 更大的白围脖 -->
  <ellipse cx="64" cy="65" rx="32" ry="28" fill="url(#furWhite)"/>

  <!-- 嘴套白色区域 -->
  <ellipse cx="64" cy="75" rx="20" ry="14" fill="#fff"/>

  <!-- 淡淡的虎斑纹（更柔和） -->
  <g fill="#888" opacity="0.3">
    <!-- 额头M纹 -->
    <path d="M52 35 L56 42 L60 36" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
    <path d="M76 35 L72 42 L68 36" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 大眼睛（更圆更大） -->
  <g>
    <!-- 左眼 -->
    <ellipse cx="48" cy="56" rx="14" ry="15" fill="url(#eyeGrad)"/>
    <!-- 瞳孔 -->
    <ellipse cx="48" cy="56" rx="6" ry="10" fill="#2d5016"/>
    <!-- 大高光（呆萌感） -->
    <circle cx="52" cy="50" r="5" fill="#fff"/>
    <circle cx="44" cy="60" r="2.5" fill="#fff" opacity="0.7"/>
    <!-- 眼睛轮廓 -->
    <ellipse cx="48" cy="56" rx="14" ry="15" fill="none" stroke="#5a8a5a" stroke-width="1.5"/>

    <!-- 右眼 -->
    <ellipse cx="80" cy="56" rx="14" ry="15" fill="url(#eyeGrad)"/>
    <!-- 瞳孔 -->
    <ellipse cx="80" cy="56" rx="6" ry="10" fill="#2d5016"/>
    <!-- 大高光 -->
    <circle cx="84" cy="50" r="5" fill="#fff"/>
    <circle cx="76" cy="60" r="2.5" fill="#fff" opacity="0.7"/>
    <!-- 眼睛轮廓 -->
    <ellipse cx="80" cy="56" rx="14" ry="15" fill="none" stroke="#5a8a5a" stroke-width="1.5"/>
  </g>

  <!-- 小鼻子（更粉嫩） -->
  <path d="M59 72 Q64 76, 69 72 Q64 80, 59 72" fill="#ff8fa3"/>

  <!-- W形嘴巴（更可爱） -->
  <path d="M64 78 Q59 82, 54 78" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  <path d="M64 78 Q69 82, 74 78" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  <!-- 小舌头 -->
  <ellipse cx="64" cy="81" rx="3" ry="2" fill="#ff8fa3" opacity="0.8"/>

  <!-- 大大的腮红（甜美感关键） -->
  <ellipse cx="36" cy="68" rx="10" ry="7" fill="url(#blushGrad)"/>
  <ellipse cx="92" cy="68" rx="10" ry="7" fill="url(#blushGrad)"/>

  <!-- 细细的胡须 -->
  <g stroke="#bbb" stroke-width="1" fill="none" opacity="0.6">
    <line x1="32" y1="65" x2="12" y2="62"/>
    <line x1="32" y1="70" x2="10" y2="70"/>
    <line x1="32" y1="75" x2="12" y2="78"/>
    <line x1="96" y1="65" x2="116" y2="62"/>
    <line x1="96" y1="70" x2="118" y2="70"/>
    <line x1="96" y1="75" x2="116" y2="78"/>
  </g>

  <!-- 可爱的白色爪子 -->
  <ellipse cx="42" cy="108" rx="10" ry="7" fill="#fff"/>
  <ellipse cx="86" cy="108" rx="10" ry="7" fill="#fff"/>

  <!-- 爪子肉垫 -->
  <g fill="#ffb6c1">
    <ellipse cx="40" cy="106" rx="2" ry="2.5"/>
    <ellipse cx="42" cy="104" rx="2" ry="2.5"/>
    <ellipse cx="44" cy="106" rx="2" ry="2.5"/>
    <ellipse cx="84" cy="106" rx="2" ry="2.5"/>
    <ellipse cx="86" cy="104" rx="2" ry="2.5"/>
    <ellipse cx="88" cy="106" rx="2" ry="2.5"/>
  </g>

  <!-- 头顶装饰：可爱的禁止广告小标志 -->
  <g transform="translate(64, 18)">
    <!-- 小星星背景 -->
    <path d="M0 -10 L2 -3 L9 -3 L3 1 L5 8 L0 4 L-5 8 L-3 1 L-9 -3 L-2 -3 Z" fill="#ffd700" opacity="0.6"/>
    <!-- 禁止符号 -->
    <circle cx="0" cy="0" r="8" fill="#ff6b8a" opacity="0.9"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 装饰：小星星点缀 -->
  <g fill="#ffd700" opacity="0.5">
    <circle cx="24" cy="85" r="2"/>
    <circle cx="104" cy="45" r="1.5"/>
    <circle cx="108" cy="90" r="2"/>
  </g>
</svg>